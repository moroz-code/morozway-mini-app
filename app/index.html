<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#09090c">
  <title>MOROZWAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="static/home-layout.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div id="snowfield" aria-hidden="true"></div>

  <main class="app">

    <header class="home-topbar" aria-label="Быстрые действия">
      <button class="topbar-button" type="button" aria-label="Профиль" onclick="openProfile()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-4 3-6 7-6s6.5 2 7 6"/></svg>
      </button>
      <div class="topbar-balance"><span class="topbar-amount">0</span><span aria-hidden="true">★</span></div>
      <button class="topbar-button theme-trigger" type="button" aria-label="Цветовая тема" aria-expanded="false" onclick="toggleThemePicker()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      </button>
    </header>

    <div class="theme-popover" id="themePopover" aria-label="Выбор цветовой темы" hidden>
      <div class="theme-popover-title">Цвет оформления</div>
      <div class="theme-options" role="group" aria-label="Цветовая тема">
        <button class="theme-dot" data-theme="red" aria-label="Красная"></button>
        <button class="theme-dot" data-theme="blue" aria-label="Синяя"></button>
        <button class="theme-dot" data-theme="purple" aria-label="Фиолетовая"></button>
        <button class="theme-dot" data-theme="emerald" aria-label="Изумрудная"></button>
        <button class="theme-dot" data-theme="pink" aria-label="Розовая"></button>
        <button class="theme-dot" data-theme="cyan" aria-label="Бирюзовая"></button>
        <button class="theme-dot" data-theme="orange" aria-label="Оранжевая"></button>
        <button class="theme-dot" data-theme="gold" aria-label="Золотая"></button>
        <button class="theme-dot" data-theme="violet" aria-label="Лавандовая"></button>
        <button class="theme-dot" data-theme="ice" aria-label="Ледяная"></button>
        <button class="theme-dot" data-theme="mint" aria-label="Мятная"></button>
        <button class="theme-dot" data-theme="rose" aria-label="Малиновая"></button>
      </div>
    </div>

    <section class="hero">
      <div class="hero-glow"></div>
      <img class="hero-mascots" src="static/mascots.png" alt="Персонажи">
  
    </section>


    <section class="balance card reveal" aria-label="Баланс">
      <div class="balance-head"><span>БАЛАНС</span></div>
      <div class="amount">0 <span>★</span></div>
    </section>

    <section class="stats reveal">
      <div class="stat card"><span class="stat-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-4 3-6 7-6s6.5 2 7 6"/></svg></span><b id="homeFriends">0</b><small>друзей</small></div>
      <div class="stat card"><span class="stat-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 13h6l-1 9 9-12h-6l1-8z"/></svg></span><b id="homeDays">1</b><small>дней в боте</small></div>
      <div class="stat card"><span class="stat-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M12 9H7.5a2.5 2.5 0 1 1 2.5-2.5V9Zm0 0h4.5A2.5 2.5 0 1 0 14 6.5V9Z"/></svg></span><b id="homeReferralReward">+3</b><small>за друга</small></div>
    </section>

    <div class="section-heading reveal" style="display:none">
      <div><span class="eyebrow">ВОЗМОЖНОСТИ</span><h2>Выбирай свой путь</h2></div>
      <span class="heading-mark">✧</span>
    </div>

    <section class="tiles reveal">
      <button class="tile task-tile" onclick="showSection('Задания')">
        <span class="tile-icon">☑</span>
        <span class="tile-copy"><b>Задания</b><small>Зарабатывай звёзды</small></span>
        <span class="tile-arrow">↗</span>
      </button>
      <button class="tile case-tile" onclick="openCase()">
        <span class="tile-icon">♧</span>
        <span class="tile-copy"><b>Кейс</b><small>25 за прокрут</small></span>
        <span class="tile-arrow">↗</span>
      </button>
    </section>

    <div class="section-heading secondary-heading reveal" style="display:none">
      <div><span class="eyebrow">ТВОЙ АККАУНТ</span><h2>Быстрый доступ</h2></div>
    </div>
    <section class="links card reveal">
      <button onclick="showSection('Вывод')"><span class="link-icon">＄</span><span>Вывод</span><span class="link-arrow">›</span></button>
      <button onclick="openReferrals()"><span class="link-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span>Рефералы</span><span class="link-arrow">›</span></button>
      <button onclick="openProfile()"><span class="link-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-4 3-6 7-6s6.5 2 7 6"/></svg></span><span>Профиль</span><span class="link-arrow">›</span></button>
    </section>


    <p id="notice">Добро пожаловать в MOROZWAY</p>
    <footer class="footer"><small>YOUR STARS. YOUR WAY.</small></footer>
  </main>

  <script src="static/script.js"></script>
  <script src="static/experience.js"></script>

<script src="static/api-config.js"></script>
<script src="static/api.js"></script>
</body>
</html>
